services:
  db:
    image: postgres:16
    container_name: kybershield-db
    environment:
      POSTGRES_USER: kybershield
      POSTGRES_PASSWORD: localdev
      POSTGRES_DB: kybershield
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kybershield"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  pgdata:
